<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Order Up — Office Breakfast</title>
<meta name="description" content="Group breakfast ordering for the office: join a room, add your order, split the delivery fee automatically." />
<meta name="theme-color" content="#241811" />

<!-- Fonts: Fraunces (display), Inter (body/UI), IBM Plex Mono (receipt/data) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/styles.css" />

<!--
  The frontend is served by the same Spring Boot app as the API (same
  origin), so no base URL override is needed by default. Set this only if
  you're running the frontend separately from the backend:
  window.BREAKFAST_API_BASE = "https://api.yourcompany.com/api";
-->
<script>
  // Intentionally left unset: api.js defaults to the same-origin "/api".
  // window.BREAKFAST_API_BASE = "http://localhost:8080/api";
</script>
</head>
<body>

<div id="app">
  <header class="app-header" id="app-header">
    <a href="#/dashboard" class="wordmark">Order Up<span class="dot">.</span></a>
    <div class="header-right" id="header-right"></div>
  </header>

  <main id="view-root">
    <div class="spinner"></div>
  </main>

  <nav class="bottom-nav hidden" id="bottom-nav">
    <button data-route="#/dashboard" data-name="dashboard">
      <span class="glyph">🧺</span>
      Rooms
    </button>
    <button data-route="#/account" data-name="account">
      <span class="glyph">👤</span>
      Account
    </button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
