server:
  port: 8080

spring:
  application:
    name: smart-breakfast-backend

  # --- Choose ONE datasource block ---

  # MySQL (default, active)
  datasource:
    url: jdbc:mysql://localhost:3306/breakfast_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # PostgreSQL (uncomment and comment out the MySQL block above to switch)
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/breakfast_db
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:postgres}
  #   driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # dialect auto-detected; uncomment to force:
        # dialect: org.hibernate.dialect.MySQLDialect
        # dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt:
    # In production, set JWT_SECRET as an environment variable (min 256-bit / 32+ char random string)
    secret: ${JWT_SECRET:change-this-super-secret-key-to-something-long-and-random-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  room:
    duration-minutes: 60
    scheduler:
      fixed-rate-ms: 60000 # check every 1 minute

logging:
  level:
    com.smartoffice.breakfast: INFO
    org.springframework.security: WARN
